spring.application.name=musicdiary

# ===== DB 설정 (지금은 H2 메모리 DB, 나중에 MySQL 로 교체 예정) =====
# 메모리 DB 라서 서버를 끄면 데이터가 사라져요.
spring.datasource.url=jdbc:h2:mem:musicdiary
spring.datasource.username=sa
spring.datasource.password=

# H2 웹 콘솔: 서버 실행 후 http://localhost:8080/h2-console 에서 테이블을 눈으로 확인할 수 있어요.
spring.h2.console.enabled=true

# ===== JPA 설정 =====
# create: 서버를 켤 때마다 엔티티를 보고 테이블을 새로 만들어요. (개발용!)
spring.jpa.hibernate.ddl-auto=create
# 실행되는 SQL 을 콘솔에 보기 좋게 출력
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
