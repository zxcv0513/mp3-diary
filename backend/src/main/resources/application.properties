spring.application.name=musicdiary

# ===== DB 설정 (지금은 H2 메모리 DB, 나중에 MySQL 로 교체 예정) =====
# 메모리 DB 라서 서버를 끄면 데이터가 사라져요.
spring.datasource.url=jdbc:h2:mem:musicdiary
spring.datasource.username=sa
spring.datasource.password=

# H2 웹 콘솔: 서버 실행 후 http://localhost:8080/h2-console 에서 테이블을 눈으로 확인할 수 있어요.
spring.h2.console.enabled=true

# ===== JPA 설정 =====
# create: 서버를 켤 때마다 엔티티를 보고 테이블을 새로 만들어요. (개발용!)
spring.jpa.hibernate.ddl-auto=create
# 실행되는 SQL 을 콘솔에 보기 좋게 출력
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== CORS: 요청을 허용할 프론트엔드 주소 (쉼표로 여러 개) =====
# ${환경변수:기본값} → 환경 변수 CORS_ALLOWED_ORIGINS 가 있으면 그 값, 없으면 기본값 사용
# Cloudflare Pages 주소:
#   https://mp3-diary.pages.dev          ← 실제 사이트
#   https://*.mp3-diary.pages.dev        ← 커밋/브랜치별 미리보기 주소 (예: https://a1b2c3.mp3-diary.pages.dev)
# ※ https://*.pages.dev 로 적으면 "남의 Pages 사이트"까지 허용돼서 이 프로젝트 주소만 적었어요.
# ※ Pages 프로젝트 이름이 mp3-diary 가 아니게 되면 여기도 바꿔주세요.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://mp3-diary.pages.dev,https://*.mp3-diary.pages.dev}
